<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<title>Petualangan Tumbuhan – Game Edukasi VR (v14 Voxel)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#7ec8f5;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#fff}
#c{display:block;width:100%;height:100%;touch-action:none}
.pill{background:rgba(40,50,40,.78);border-radius:22px;padding:8px 16px;font-weight:700;font-size:15px;width:fit-content}
.pill:empty{display:none}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
.tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;max-width:62vw}
.bar{height:8px;background:#fff4;border-radius:5px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ffd23f}
#mm{position:absolute;right:12px;bottom:12px;border-radius:16px;border:4px solid #fff;width:160px;height:128px}
#bt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:60vw;text-align:center}
#tt{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:80vw;text-align:center;background:rgba(46,125,50,.92)}
.ib{position:absolute;pointer-events:auto;border:0;border-radius:50%;background:rgba(40,50,40,.78);color:#fff;font-size:22px;width:46px;height:46px;cursor:pointer;padding:0}
#bJ{right:22px;bottom:240px;width:62px;height:62px;font-size:26px;background:rgba(33,150,243,.9);display:none}#bMenu{right:12px;top:12px}#bMus{right:66px;top:12px}
#bE{right:22px;bottom:160px;width:70px;height:70px;font:700 28px "Trebuchet MS",sans-serif;background:rgba(76,175,80,.92);display:none}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:3px solid #fff8;border-radius:50%;display:none;pointer-events:none;z-index:4}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#fffa}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,50,20,.45);z-index:5}
#dlg{align-items:flex-end;padding-bottom:30px;background:rgba(20,50,20,.2)}
.box{background:#fffbea;color:#2b3a1f;border-radius:22px;padding:20px 26px;width:min(640px,92vw);box-shadow:0 8px 0 #c9a227,0 12px 30px #0006;max-height:90vh;overflow:auto}
.box h1,.box h3{margin:0 0 8px;color:#2e7d32}.box p{margin:6px 0 10px;font-size:17px;line-height:1.45;white-space:pre-line}
.btn{display:block;width:100%;margin-top:8px;padding:11px;border:0;border-radius:14px;background:#4caf50;color:#fff;font:700 16px "Trebuchet MS",sans-serif;cursor:pointer;box-shadow:0 4px 0 #2e7d32}
.btn:hover:not(:disabled){background:#43a047}.btn:disabled{background:#9e9e9e;box-shadow:0 4px 0 #757575;cursor:not-allowed}
input{width:100%;box-sizing:border-box;margin:5px 0;padding:10px;border-radius:12px;border:2px solid #c9a227;font-size:16px}
#err{color:#c62828;font-weight:700;min-height:20px}
.vw{position:relative;width:min(100%,calc(52vh*1.7778));aspect-ratio:16/9;margin:8px auto 4px;background:#000;border-radius:14px;overflow:hidden}
.vw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

#start{justify-content:flex-start;align-items:center;padding:0 7vw;background:linear-gradient(90deg,rgba(6,24,10,.9) 0%,rgba(6,24,10,.55) 42%,rgba(6,24,10,0) 82%)}
#mn{width:min(430px,100%);display:flex;flex-direction:column;gap:10px;color:#fff;font-family:"Trebuchet MS","Segoe UI",sans-serif}
.logo{margin-bottom:12px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.lg1{display:block;font-weight:800;font-size:clamp(14px,2.4vw,20px);letter-spacing:.5em;color:#ffe27a;text-transform:uppercase}
.lg2{display:block;font-weight:900;font-size:clamp(40px,8vw,74px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;background:linear-gradient(180deg,#f1ffc2,#82e03f 55%,#2f9e3a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #1d5a24}
.lg3{display:block;margin-top:8px;font-weight:600;font-size:15px;color:#d6f5c9;opacity:.92}
.ins{align-self:flex-start;background:rgba(255,255,255,.94);border-radius:16px;padding:5px 10px;box-shadow:0 4px 14px rgba(0,0,0,.35);margin-bottom:0;animation:mi .5s backwards}.ins img{display:block;width:min(170px,42vw);height:auto}
#mm1,#mm2{display:flex;flex-direction:column;gap:10px}#mm2{display:none;background:rgba(10,30,16,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:18px 20px}
#mm2 h3{margin:0 0 4px;color:#ffe27a;font-size:22px}#mm2 p{margin:4px 0;font-size:14.5px;line-height:1.45;color:#e6f6df}
.kg{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;align-items:center}.kg b{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:3px 9px;font-size:13px;white-space:nowrap}
.mb{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:14px 20px;border:1px solid rgba(255,255,255,.3);border-radius:16px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:700 16px "Trebuchet MS",sans-serif;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;text-align:left;transition:transform .15s,background .15s,box-shadow .15s;animation:mi .5s backwards}
@keyframes mi{from{opacity:0;transform:translateX(-26px)}}
#mm1>:nth-child(2){animation-delay:.05s}#mm1>:nth-child(4){animation-delay:.1s}#mm1>:nth-child(5){animation-delay:.15s}#mm1>:nth-child(6){animation-delay:.2s}#mm1>:nth-child(7){animation-delay:.25s}
.mb:hover:not(:disabled){transform:translateX(8px);background:rgba(255,255,255,.22);box-shadow:0 0 0 2px rgba(255,226,122,.65),0 8px 24px rgba(0,0,0,.3)}
.mb.p{background:linear-gradient(180deg,#6fe03a,#2ea043);border-color:#c8ff9a;font-size:19px;padding:17px 22px;box-shadow:0 6px 0 #1b6b2a,0 10px 24px rgba(0,0,0,.35)}
.mb.b{background:linear-gradient(180deg,#4aa8ff,#2f6fe0);border-color:#b7dbff}.mb:disabled{opacity:.5;cursor:not-allowed}
#nama{background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:14px 16px;font:600 17px "Trebuchet MS",sans-serif;margin:0}
#nama::placeholder{color:rgba(255,255,255,.65)}#nama:focus{outline:0;box-shadow:0 0 0 2px #ffe27a}
#start #err{color:#ffb4a8;min-height:18px;font-size:14px;margin:-2px 0}.mf{margin-top:6px;font-size:12.5px;color:rgba(255,255,255,.65);letter-spacing:.04em}
@media(max-width:700px){#start{justify-content:center;padding:0 5vw;background:rgba(6,24,10,.62)}}

#cs{position:fixed;inset:0;z-index:6;display:none;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#fff;cursor:pointer}
.cbar{position:absolute;left:0;right:0;height:11vh;background:#000;animation:cb .8s both}.cbar.t{top:0;transform-origin:top}.cbar.b{bottom:0;transform-origin:bottom}@keyframes cb{from{transform:scaleY(0)}}
#cbox{position:absolute;left:50%;bottom:13vh;transform:translateX(-50%);width:min(760px,92vw);box-sizing:border-box;padding:22px 24px 12px;border-radius:18px;background:rgba(18,34,28,.58);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#cwho{position:absolute;left:18px;top:-16px;padding:4px 16px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.5);box-shadow:0 3px 10px rgba(0,0,0,.35)}
#ctxt{font-size:clamp(15px,2.2vw,19px);line-height:1.5;min-height:3em;text-shadow:0 1px 3px rgba(0,0,0,.55)}#cbox.nar{text-align:center;font-style:italic}#chint{text-align:right;font-size:12.5px;opacity:.75;margin-top:4px}
#cskip{position:absolute;right:16px;top:calc(11vh + 12px);padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(18,34,28,.55);backdrop-filter:blur(8px);color:#fff;font:700 14px "Trebuchet MS",sans-serif;cursor:pointer}
#cfade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:7;transition:opacity .7s}
#ctitle{position:absolute;left:0;right:0;top:32%;text-align:center;opacity:0;pointer-events:none;text-shadow:0 4px 18px #000}#ctitle small{display:block;letter-spacing:.4em;font-size:15px;color:#ffe27a;text-transform:uppercase}#ctitle b{font-size:clamp(34px,7vw,64px)}
#ctitle.go{animation:ct 4s .6s both}@keyframes ct{0%{opacity:0;transform:translateY(12px)}20%,70%{opacity:1;transform:none}100%{opacity:0}}
@media print{body>*:not(#dlg){display:none!important}#dlg{display:flex!important;position:static;background:none}.box{box-shadow:none;color:#000}.btn{display:none}}
</style></head><body>

{judul:"Perkembangbiakan Generatif (Biji)",tujuan:"Temui Bu Sari di dekat ladang",
 pt:"Tanam & rawat jagung sampai panen",
 praktik:"Saatnya praktik, {n}!\n1) Isi kaleng air di sumur dekat jalan 💧.\n2) Tanam biji jagung di 3 petak di belakang ladang (tekan E).\n3) Siram tiap tanaman sampai tumbuh: biji → kecambah → tumbuhan muda → dewasa berbunga.\n4) Panen biji baru dari tanaman dewasa!\nKaleng air hanya muat 4 kali siram, jadi atur dengan bijak.",
 intro:"Halo, {n}! Aku Bu Sari. Ayo belajar bagaimana tumbuhan berkembang biak dengan biji.",
 materi:["Sama seperti hewan, tumbuhan juga dapat berkembang biak dengan cara yang berbeda-beda. Salah satunya dengan biji, misalnya mangga, padi, dan jagung.",
 "Biji merupakan cara perkembangbiakan tumbuhan secara generatif. Biji berkembang dari bunga yang sudah dibuahi. Dari biji akan keluar kecambah yang berkembang menjadi tumbuhan baru.",
 "Contoh tumbuhan yang berkembang biak dengan biji adalah padi, jagung, kacang, dan mangga.",
 "Siklus hidup tumbuhan dari biji dimulai dari biji, tumbuh menjadi kecambah, lalu tumbuhan muda, hingga tumbuhan dewasa yang dapat berbunga dan menghasilkan biji kembali."],
 soal:[{q:"Biji berkembang dari ...",o:["bunga yang sudah dibuahi","batang yang dipotong","umbi lapis","rimpang"],a:0,p:"Biji berkembang dari bunga yang sudah dibuahi."},
 {q:"Urutan siklus hidup tumbuhan dari biji adalah ...",o:["biji, kecambah, tumbuhan muda, tumbuhan dewasa","biji, tumbuhan muda, kecambah, tumbuhan dewasa","kecambah, biji, tumbuhan dewasa, tumbuhan muda","tumbuhan dewasa, biji, tumbuhan muda, kecambah"],a:0,p:"Biji tumbuh menjadi kecambah, tumbuhan muda, lalu tumbuhan dewasa yang berbunga dan menghasilkan biji kembali."}]},
{judul:"Perkembangbiakan Vegetatif Alami",tujuan:"Temui Pak Budi di kebun",
 pt:"Tanam & rawat pisang, bawang merah, jahe",
